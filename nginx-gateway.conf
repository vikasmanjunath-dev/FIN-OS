# FIN•OS API Gateway — Nginx config (v3)
# Single entry point on :8000 for every backend.
#
#   /api/alerts|health-score|benchmark → alert-engine  :8001
#   (clients append their own /api/... — e.g. /api/rag/api/search → rag /api/search)
#   /api/stocks   → stock-engine :8003      /api/docs   → document-ai :8004
#   /api/market   → market-intel :5000      /api/arya   → arya-ai     :7475
#   /api/rag      → rag-engine   :7476      /health     → health aggregator (all of the above)
#
# v3 changes: per-IP rate limits (heavier on LLM routes), origin allow-list instead of "*",
# security headers, request-id propagation, real aggregated /health, Arya + RAG routes.

# ── Rate limiting zones (10 MB ≈ 160k IPs each) ──────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_llm:10m     rate=2r/s;     # Arya, RAG, Document AI (LLM-backed, expensive)
limit_req_status 429;

# ── CORS: only echo origins we trust (add production domains here) ────
map $http_origin $cors_origin {
    default                                  "";
    "~^https://finos1\.vercel\.app$"         $http_origin;
    "~^https://[a-z0-9-]+\.vercel\.app$"     $http_origin;   # preview deployments
    "~^http://localhost(:[0-9]+)?$"          $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$"       $http_origin;
}

# Reused on every proxied location
map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

server {
    listen 80;
    server_name localhost;

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
    add_header Access-Control-Allow-Headers "Content-Type,Authorization,apikey,X-Request-Id" always;
    add_header Vary "Origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-FIN-OS-Gateway "v3" always;
    add_header X-Request-Id $req_id always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id      $req_id;

    # Preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    client_max_body_size 1m;
    limit_req zone=api_general burst=40 nodelay;

    # ── Gateway health — aggregated across all services ─────────────
    location = /health {
        proxy_pass http://gateway-health:8010/health;
        proxy_read_timeout 5s;
    }

    # ── Alert Engine + Health Score ─────────────────────────────────
    location /api/alerts/       { proxy_pass http://alert-engine:8001/alerts/;       proxy_read_timeout 60s; }
    location /api/health-score/ { proxy_pass http://alert-engine:8001/health-score/; }
    location /api/benchmark/    { proxy_pass http://alert-engine:8001/benchmark/; }
    location /metrics           { proxy_pass http://alert-engine:8001/metrics; allow 127.0.0.1; allow 172.16.0.0/12; deny all; }  # internal scrape only

    # ── Stock Engine ────────────────────────────────────────────────
    location /api/stocks/ { proxy_pass http://stock-engine:8003/api/; proxy_read_timeout 30s; }

    # ── Document AI (LLM extraction — slow + expensive) ─────────────
    location /api/docs/ {
        limit_req zone=api_llm burst=5 nodelay;
        proxy_pass http://document-ai:8004/;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # ── Market Intelligence ─────────────────────────────────────────
    location /api/market/ { proxy_pass http://market-intel:5000/; proxy_read_timeout 30s; }

    # ── Arya AI (chat, reports, SSE streaming) ──────────────────────
    location /api/arya/ {
        limit_req zone=api_llm burst=10 nodelay;
        proxy_pass http://arya-ai:7475/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;               # keep Server-Sent Events flowing token-by-token
        proxy_read_timeout 300s;
    }

    # ── RAG engine (retrieval + generation) ─────────────────────────
    location /api/rag/ {
        limit_req zone=api_llm burst=10 nodelay;
        proxy_pass http://rag-engine:7476/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"Unknown route","valid":["/api/alerts/","/api/stocks/","/api/docs/","/api/market/","/api/arya/","/api/rag/","/health"]}';
    }
}
