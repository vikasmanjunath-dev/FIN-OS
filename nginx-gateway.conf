# FIN•OS API Gateway — Nginx config
# All services unified behind port 8000
# Usage: GET http://localhost:8000/api/alerts/...
#        GET http://localhost:8000/api/stocks/...
#        GET http://localhost:8000/api/budget/...
#        POST http://localhost:8000/api/docs/parse/document
#        GET http://localhost:8000/api/market/...
#        GET http://localhost:8000/health  → gateway health

server {
    listen 80;
    server_name localhost;

    # CORS headers for browser requests
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" always;
    add_header Access-Control-Allow-Headers "Content-Type,Authorization,apikey" always;
    add_header X-FIN-OS-Gateway "v2" always;

    # Preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── Gateway health ──────────────────────────────────────────────
    location = /health {
        return 200 '{"status":"ok","gateway":"finos-v2","services":["alerts","stocks","budget","docs","market"]}';
        add_header Content-Type application/json;
    }

    # ── Alert Engine + Health Score ─────────────────────────────────
    location /api/alerts/ {
        proxy_pass          http://alert-engine:8001/alerts/;
        proxy_set_header    Host $host;
        proxy_read_timeout  60s;
    }
    location /api/health-score/ {
        proxy_pass          http://alert-engine:8001/health-score/;
        proxy_set_header    Host $host;
    }
    location /api/benchmark/ {
        proxy_pass          http://alert-engine:8001/benchmark/;
        proxy_set_header    Host $host;
    }
    location /metrics {
        proxy_pass          http://alert-engine:8001/metrics;
    }

    # ── Stock Engine ────────────────────────────────────────────────
    location /api/stocks/ {
        proxy_pass          http://stock-engine:8003/api/;
        proxy_set_header    Host $host;
        proxy_read_timeout  30s;
    }

    # ── Budget Backend (Django) ─────────────────────────────────────
    location /api/budget/ {
        proxy_pass          http://budget-backend:8000/api/;
        proxy_set_header    Host $host;
        proxy_read_timeout  60s;
    }

    # ── Document AI ─────────────────────────────────────────────────
    location /api/docs/ {
        proxy_pass          http://document-ai:8004/;
        proxy_set_header    Host $host;
        proxy_read_timeout  120s;  # LLM extraction can be slow
        client_max_body_size 10m;
    }

    # ── Market Intelligence ─────────────────────────────────────────
    location /api/market/ {
        proxy_pass          http://market-intel:5000/;
        proxy_set_header    Host $host;
        proxy_read_timeout  30s;
    }

    # ── Static placeholder for unknown routes ───────────────────────
    location / {
        return 404 '{"error":"Unknown route. Valid: /api/alerts/, /api/stocks/, /api/budget/, /api/docs/, /api/market/"}';
        add_header Content-Type application/json;
    }
}
