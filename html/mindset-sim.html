<style>
  :root { --purple: #a78bff; --pink: #ff2a6d; --cyan: #00f3ff; --green: #00ff88; }
  .sim-wrapper { max-width: 800px; margin: 0 auto; padding: 32px 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .sim-header { text-align: center; margin-bottom: 36px; }
  .sim-header h1 { font-size: 30px; font-weight: 800; color: #fff; margin: 12px 0 6px; background: linear-gradient(135deg,var(--purple),var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sim-header p { font-size: 14px; color: rgba(255,255,255,.4); }

  /* Scenario grid */
  .scenario-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-bottom: 32px; }
  .scenario-card {
    background: var(--bg-surface); border: 1px solid var(--border-soft);
    border-radius: 16px; padding: 18px; cursor: pointer; transition: all .2s;
    position: relative; overflow: hidden;
  }
  .scenario-card:hover { border-color: var(--purple); background: rgba(167,139,255,.06); transform: translateY(-2px); }
  .scenario-card.active { border-color: var(--green); background: rgba(0,255,136,.06); }
  .sc-tag { font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; padding: 3px 8px; border-radius: 10px; display: inline-block; margin-bottom: 10px; }
  .tag-crash  { background: rgba(255,42,109,.12); color: #ff2a6d; border: 1px solid rgba(255,42,109,.25); }
  .tag-fomo   { background: rgba(255,183,3,.1); color: #ffb703; border: 1px solid rgba(255,183,3,.2); }
  .tag-crisis { background: rgba(167,139,255,.1); color: var(--purple); border: 1px solid rgba(167,139,255,.2); }
  .tag-trap   { background: rgba(255,107,107,.1); color: #ff6b6b; border: 1px solid rgba(255,107,107,.2); }
  .tag-life   { background: rgba(0,243,255,.08); color: var(--cyan); border: 1px solid rgba(0,243,255,.2); }
  .sc-name  { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .sc-desc  { font-size: 11px; color: rgba(255,255,255,.4); line-height: 1.5; }
  .sc-diff  { position: absolute; top: 12px; right: 12px; font-size: 10px; font-weight: 700; }

  /* Simulation arena */
  .sim-arena { display: none; }
  .sim-arena.active { display: block; }
  .sim-scene-header {
    background: linear-gradient(135deg,rgba(167,139,255,.08),rgba(0,243,255,.04));
    border: 1px solid rgba(167,139,255,.2); border-radius: 18px;
    padding: 24px; margin-bottom: 20px;
  }
  .sim-year-badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
    border-radius: 20px; background: rgba(167,139,255,.12); border: 1px solid rgba(167,139,255,.3);
    color: var(--purple); font-size: 12px; font-weight: 700; margin-bottom: 14px;
  }
  .sim-portfolio-bar {
    display: flex; gap: 16px; flex-wrap: wrap; margin: 14px 0;
    padding: 12px 16px; background: rgba(0,0,0,.3); border-radius: 10px;
    font-size: 13px; font-family: 'JetBrains Mono', monospace;
  }
  .pb-item { display: flex; flex-direction: column; gap: 2px; }
  .pb-label { font-size: 9px; color: rgba(255,255,255,.3); text-transform: uppercase; letter-spacing: .8px; }
  .pb-val   { font-size: 16px; font-weight: 700; }

  .sim-narrative {
    font-size: 15px; color: rgba(255,255,255,.85); line-height: 1.8;
    margin: 14px 0; border-left: 3px solid var(--purple); padding-left: 16px;
  }

  .sim-choices { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
  .sim-choice {
    padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border-soft);
    background: var(--bg-surface); cursor: pointer; font-size: 14px;
    color: rgba(255,255,255,.8); text-align: left; transition: all .2s;
    font-family: -apple-system, sans-serif;
  }
  .sim-choice:hover { border-color: var(--purple); background: rgba(167,139,255,.08); }

  /* Outcome reveal */
  .sim-outcome {
    display: none; background: linear-gradient(135deg,rgba(0,255,136,.04),rgba(0,0,0,0));
    border: 1px solid rgba(0,255,136,.15); border-radius: 16px; padding: 20px; margin-top: 20px;
  }
  .sim-outcome.active { display: block; }
  .outcome-title { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #00ff88; margin-bottom: 12px; }
  .outcome-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .oc-box { padding: 14px; border-radius: 12px; text-align: center; }
  .oc-box-held   { background: rgba(0,255,136,.08); border: 1px solid rgba(0,255,136,.2); }
  .oc-box-sold   { background: rgba(255,107,107,.06); border: 1px solid rgba(255,107,107,.15); }
  .oc-label { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: rgba(255,255,255,.4); margin-bottom: 6px; }
  .oc-amount { font-size: 22px; font-weight: 800; }
  .oc-sub { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 2px; }

  .score-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .s-chip {
    padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
  }

  .ai-debrief-box {
    margin-top: 16px; padding: 16px; border-radius: 12px;
    background: rgba(9,13,18,.98); border: 1px solid rgba(167,139,255,.15);
    font-size: 13px; color: rgba(255,255,255,.82); line-height: 1.75;
  }
  .ai-debrief-title { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--purple); margin-bottom: 8px; }

  .sim-cta-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .sim-btn {
    padding: 11px 20px; border-radius: 12px; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: -apple-system, sans-serif; transition: all .2s;
  }
  .sim-btn-primary { background: linear-gradient(135deg,var(--purple),#7c3aed); color: #fff; border: none; }
  .sim-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(167,139,255,.3); }
  .sim-btn-ghost { background: var(--bg-surface); border: 1px solid var(--border-soft); color: rgba(255,255,255,.6); }
  .sim-btn-ghost:hover { background: var(--bg-surface); }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: -apple-system, sans-serif; transition: all .15s;
    border: 1px solid var(--border-soft); background: var(--bg-surface); color: rgba(255,255,255,.5);
  }
  .filter-btn.active { border-color: var(--purple); background: rgba(167,139,255,.1); color: var(--purple); }
  .filter-btn:hover { border-color: rgba(167,139,255,.4); }


/* ── Light mode overrides ── */
[data-theme="light"] .sc-name         { color: var(--text-primary) !important; }

[data-theme="light"] .oc-label        { color: rgba(0,0,0,.45) !important; }
[data-theme="light"] .oc-sub          { color: rgba(0,0,0,.45) !important; }
[data-theme="light"] .ai-debrief-box  {

}
[data-theme="light"] .sim-btn-ghost   { color: rgba(0,0,0,.55) !important; }
[data-theme="light"] .filter-btn      { color: rgba(0,0,0,.5) !important; }

/* ══════════════════════════════════════════════════════════════════════════

const SCENARIOS = [
  // ── MARKET CRASHES ──────────────────────────────────────────────────────
  { id:'crash_2008', cat:'crash', tag:'tag-crash', diff:'⭐⭐⭐⭐⭐', name:'2008 — Lehman Collapse', desc:'Nifty -52%. ₹5L portfolio down 45% in 6 weeks.',

let currentScenarioIdx = 0;
let filteredScenarios  = [...SCENARIOS];
let userChoice         = null;

/* ── Render scenario grid ─────────────────────────────────────────────── */
function filterScenarios(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filteredScenarios = cat === 'all' ? [...SCENARIOS] : SCENARIOS.filter(s => s.cat === cat);
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('scenarioGrid');
  grid.innerHTML = filteredScenarios.map((s, i) => `
    <div class="scenario-card" onclick="startScenario(${SCENARIOS.indexOf(s)})">
      <span class="sc-tag ${s.tag}">${s.cat.toUpperCase()}</span>
      <div class="sc-diff">${s.diff}</div>
      <div class="sc-name">${s.name}</div>
      <div class="sc-desc">${s.desc}</div>
    </div>`).join('');
}

/* ── Start scenario ─────────────────────────────────────────────────────── */
function startScenario(idx) {
  const s = SCENARIOS[idx];
  currentScenarioIdx = idx;
  userChoice = null;

  document.getElementById('scenarioPicker').style.display = 'none';
  const arena = document.getElementById('simArena');
  arena.classList.add('active');

  document.getElementById('simYearBadge').innerHTML = `📅 ${s.year}`;
  document.getElementById('simTitle').textContent = s.name;
  document.getElementById('simPortfolioBar').innerHTML = `
    <div class="pb-item">
      <div class="pb-label">Your Portfolio</div>
      <div class="pb-val" style="color:#ff6b6b;">${s.portfolio}</div>
    </div>
    <div class="pb-item">
      <div class="pb-label">Initial Value</div>
      <div class="pb-val" style="color:rgba(255,255,255,.7);">₹${(s.initialPortfolio/100000).toFixed(1)}L</div>
    </div>
    <div class="pb-item">
      <div class="pb-label">Scenario</div>
      <div class="pb-val" style="color:var(--purple);">${s.diff}</div>
    </div>
  `;

  // Stream narrative via Ollama
  const narr = document.getElementById('simNarrative');
  narr.textContent = s.narrative;

  // Render choices
  const choicesEl = document.getElementById('simChoices');
  choicesEl.innerHTML = s.choices.map((c, i) => `
    <button class="sim-choice" onclick="makeChoice(${idx}, ${i}, this)">${c}</button>`).join('');

  document.getElementById('simOutcome').classList.remove('active');
}

/* ── User makes a choice ────────────────────────────────────────────────── */
function makeChoice(scenarioIdx, choiceIdx, btn) {
  if (userChoice !== null) return;
  userChoice = choiceIdx;

  const s = SCENARIOS[scenarioIdx];

  // Highlight choice
  document.querySelectorAll('.sim-choice').forEach(b => {
    b.style.opacity = '0.4'; b.style.cursor = 'default';
  });
  btn.style.opacity = '1';
  btn.style.borderColor = choiceIdx === s.bestChoice ? '#00ff88' : choiceIdx === s.worstChoice ? '#ff6b6b' : '#ffb703';
  btn.style.background = choiceIdx === s.bestChoice ? 'rgba(0,255,136,.1)' : choiceIdx === s.worstChoice ? 'rgba(255,107,107,.08)' : 'rgba(255,183,3,.06)';

  revealOutcome(scenarioIdx, choiceIdx);
}

/* ── Reveal outcome ──────────────────────────────────────────────────────*/
async function revealOutcome(scenarioIdx, choiceIdx) {
  const s = SCENARIOS[scenarioIdx];
  const outcome = document.getElementById('simOutcome');
  outcome.classList.add('active');
  outcome.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // Performance score
  const isBest   = choiceIdx === s.bestChoice;
  const isWorst  = choiceIdx === s.worstChoice;
  const perfScore = isBest ? 100 : isWorst ? 10 : 55;

  // Outcome comparison
  document.getElementById('outcomeCompare').innerHTML = `
    <div class="oc-box oc-box-held">
      <div class="oc-label">📈 If Held / Best Action</div>
      <div class="oc-amount" style="color:#00ff88;">₹${(s.finalIfHeld/100000).toFixed(1)}L</div>
      <div class="oc-sub">${((s.finalIfHeld - s.initialPortfolio)/s.initialPortfolio*100).toFixed(0)}% return</div>
    </div>
    <div class="oc-box oc-box-sold">
      <div class="oc-label">❌ If Panicked</div>
      <div class="oc-amount" style="color:#ff6b6b;">₹${(s.finalIfSold/100000).toFixed(1)}L</div>
      <div class="oc-sub">${((s.finalIfSold - s.initialPortfolio)/s.initialPortfolio*100).toFixed(0)}% return</div>
    </div>`;

  // Score chips
  const color = isBest ? '#00ff88' : isWorst ? '#ff6b6b' : '#ffb703';
  const label = isBest ? '🎯 Optimal Decision' : isWorst ? '⚠️ Costly Mistake' : '📊 Acceptable';
  const biasesStr = (s.biases || []).map(b =>
    `<span class="s-chip" style="background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);color:#ff6b6b;font-size:10px;padding:3px 10px;border-radius:12px;">${b.replace(/_/g,' ')}</span>`
  ).join('');

  document.getElementById('scoreChips').innerHTML = `
    <span class="s-chip" style="background:${color}12;border:1px solid ${color}30;color:${color};font-size:12px;padding:5px 14px;border-radius:20px;">${label}</span>
    ${biasesStr}`;

  // Historical outcome text
  const outcomeText = isBest ? s.held_outcome : isWorst ? s.sold_outcome : `${s.held_outcome}\n\nYour choice was reasonable, but the optimal path was: ${s.choices[s.bestChoice]}`;

  // AI debrief
  const debriefEl = document.getElementById('simDebriefText');
  debriefEl.textContent = 'Arya debrief likh rahi hai…';

  const archetype = localStorage.getItem('finos_financial_dna') || 'Investor';
  const prompt = `
Financial scenario: "${s.name}"
User's choice: "${s.choices[choiceIdx]}"
Optimal choice was: "${s.choices[s.bestChoice]}"
Historical outcome: ${outcomeText}
Biases triggered: ${(s.biases || []).join(', ')}
User archetype: ${archetype}

Write a 3-sentence Hinglish behavioral finance debrief:
1. What bias/emotion drove this decision
2. How this specific mistake costs ₹ over time (use the numbers)
3. ONE practical rule to avoid this bias next time

Warm, non-judgmental, like a wise mentor. No preamble.
`.trim();

  const OLLAMA_URL = 'http://localhost:11434/api/generate';
  try {
    const resp = await fetch(OLLAMA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'qwen3:14b', prompt,
        system: 'You are Arya, FIN-OS behavioral finance coach. 3-sentence warm Hinglish debrief. No preamble. Mention specific ₹ amounts.',
        stream: true, options: { temperature: 0.6, num_predict: 200 },
      }),
    });
    const reader = resp.body.getReader();
    const dec    = new TextDecoder();
    let full = '';
    debriefEl.textContent = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      dec.decode(value).split('\n').forEach(line => {
        if (!line.trim()) return;
        try {
          const d = JSON.parse(line);
          const tok = (d.response || '').replace(/<think>[\s\S]*?<\/think>/gi, '');
          if (tok) { full += tok; debriefEl.textContent = full; }
        } catch {}
      });
    }
    if (!full) debriefEl.textContent = outcomeText;
  } catch {
    debriefEl.textContent = outcomeText;
  }

  // Save score to localStorage
  const simScores = JSON.parse(localStorage.getItem('finos_sim_scores') || '{}');
  simScores[s.id] = { score: perfScore, choice: choiceIdx, taken_at: new Date().toISOString() };
  localStorage.setItem('finos_sim_scores', JSON.stringify(simScores));
}

function nextScenario() {
  const nextIdx = (currentScenarioIdx + 1) % SCENARIOS.length;
  startScenario(nextIdx);
}

function backToGrid() {
  document.getElementById('scenarioPicker').style.display = 'block';
  document.getElementById('simArena').classList.remove('active');
  renderGrid();
}

document.addEventListener('DOMContentLoaded', () => {
  renderGrid();
});
</script>

<button id="themeToggle" class="theme-btn theme-btn--floating" aria-label="Toggle dark/light theme">🌙</button>
<script>
(function(){
  var btn=document.getElementById('themeToggle');
  if(!btn) return;
  var t=document.documentElement.getAttribute('data-theme')||'dark';
  btn.textContent=t==='dark'?'🌙':'☀️';
  btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var nxt=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',nxt);
    localStorage.setItem('finos-theme',nxt);
    localStorage.setItem('theme',nxt);
    btn.textContent=nxt==='dark'?'🌙':'☀️';
    btn.setAttribute('aria-label',nxt==='dark'?'Switch to light mode':'Switch to dark mode');
  });
})();
</script>
