<style>

<!-- Rates reference panel (static but authoritative) -->
<template id="fd-rates-tpl">
  <div style="font-family:-apple-system,sans-serif;">
    <p style="font-size:13px;color:#8892A4;margin-bottom:16px;">
      Current government scheme rates — effective April 2025. Bank FD rates vary; check your bank's website.
    </p>
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead>
        <tr style="border-bottom:1px solid rgba(255,255,255,.08);">
          <th style="padding:8px 10px;text-align:left;font-size:10px;color:#8892A4;text-transform:uppercase;letter-spacing:.6px;">Scheme</th>
          <th style="padding:8px 10px;text-align:right;font-size:10px;color:#8892A4;text-transform:uppercase;letter-spacing:.6px;">Rate (% p.a.)</th>
          <th style="padding:8px 10px;text-align:right;font-size:10px;color:#8892A4;text-transform:uppercase;letter-spacing:.6px;">Compounding</th>
          <th style="padding:8px 10px;text-align:right;font-size:10px;color:#8892A4;text-transform:uppercase;letter-spacing:.6px;">Lock-in</th>
          <th style="padding:8px 10px;text-align:left;font-size:10px;color:#8892A4;text-transform:uppercase;letter-spacing:.6px;">Tax Benefit</th>
        </tr>
      </thead>
      <tbody id="fd-rates-tbody"></tbody>
    </table>
    <p style="font-size:11px;color:rgba(255,255,255,.2);margin-top:12px;">Source: Ministry of Finance Q2 FY2025-26 · Rates subject to revision every quarter</p>
  </div>
</template>

<script>
const FD_TABS_MAP = { portfolio: 'fd-dashboard', maturity: 'fd-maturity-panel', rates: 'fd-rates-panel' };
const _fdInited = {};

function fdSwitchTab(tab) {
  document.querySelectorAll('.fd-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  Object.entries(FD_TABS_MAP).forEach(([k, id]) => {
    const el = document.getElementById(id);
    if (el) el.style.display = k === tab ? 'block' : 'none';
  });
  _fdInitTab(tab);
}

function _fdInitTab(tab) {
  if (_fdInited[tab]) return;
  _fdInited[tab] = true;

  const waitFor = (check, fn) => {
    if (check()) { fn(); return; }
    const t = setInterval(() => { if (check()) { clearInterval(t); fn(); } }, 150);
  };

  if (tab === 'portfolio') {
    waitFor(() => window.FinosFD, () => FinosFD.renderDashboard(document.getElementById('fd-dashboard')));
  } else if (tab === 'maturity') {
    waitFor(() => window.FinosFD, () => FinosFD.renderMaturityCalendar(document.getElementById('fd-maturity-panel')));
  } else if (tab === 'rates') {
    _renderRatesTable();
  }
}

function _renderRatesTable() {
  const tpl = document.getElementById('fd-rates-tpl');
  const panel = document.getElementById('fd-rates-panel');
  if (!tpl || !panel) return;
  panel.innerHTML = tpl.innerHTML;

  const rates = [
    { scheme:'PPF (Public Provident Fund)',    rate:7.1,  comp:'Annual',     lock:'15 years',      tax:'80C + EEE'         },
    { scheme:'NSC (5-Year)',                   rate:7.7,  comp:'Half-Yearly',lock:'5 years',       tax:'80C (accrual)'     },
    { scheme:'SCSS (Sr. Citizens)',            rate:8.2,  comp:'Quarterly',  lock:'5 years',       tax:'Interest taxable'  },
    { scheme:'Sukanya Samriddhi Yojana',       rate:8.2,  comp:'Annual',     lock:'21 yrs / 18+', tax:'80C + EEE'         },
    { scheme:'Post Office TD (1-yr)',          rate:6.9,  comp:'Quarterly',  lock:'1 year',        tax:'80C (5-yr only)'   },
    { scheme:'Post Office TD (2-yr)',          rate:7.0,  comp:'Quarterly',  lock:'2 years',       tax:'—'                 },
    { scheme:'Post Office TD (3-yr)',          rate:7.1,  comp:'Quarterly',  lock:'3 years',       tax:'—'                 },
    { scheme:'Post Office TD (5-yr)',          rate:7.5,  comp:'Quarterly',  lock:'5 years',       tax:'80C deduction'     },
    { scheme:'Post Office RD (5-yr)',          rate:6.7,  comp:'Quarterly',  lock:'5 years',       tax:'—'                 },
    { scheme:'Post Office MIS',                rate:7.4,  comp:'Monthly',    lock:'5 years',       tax:'Interest taxable'  },
    { scheme:'SGB (Sovereign Gold Bond)',      rate:2.5,  comp:'Semi-Annual',lock:'8 yrs (exit 5)','tax':'LTCG exempt'    },
    { scheme:'SBI FD (1 yr)',                  rate:6.8,  comp:'Quarterly',  lock:'1 year',        tax:'Interest taxable'  },
    { scheme:'SBI FD (3 yr)',                  rate:6.75, comp:'Quarterly',  lock:'3 years',       tax:'Interest taxable'  },
    { scheme:'HDFC FD (1 yr)',                 rate:6.6,  comp:'Quarterly',  lock:'1 year',        tax:'Interest taxable'  },
    { scheme:'Small Finance Banks',            rate:'8–9',comp:'Quarterly',  lock:'Varies',        tax:'Interest taxable'  },
  ];

  const tbody = panel.querySelector('#fd-rates-tbody');
  if (!tbody) return;
  tbody.innerHTML = rates.map((r, i) => {
    const rateNum = parseFloat(r.rate) || 0;
    const rateColor = rateNum >= 8 ? '#22D3A6' : rateNum >= 7 ? '#00D4FF' : rateNum >= 6 ? '#F0A500' : '#8892A4';
    return `<tr style="border-bottom:1px solid rgba(255,255,255,.04);${i%2===0?'background:rgba(255,255,255,.01)':''}">
      <td style="padding:10px 10px;color:#F5F7FA;font-weight:600;">${r.scheme}</td>
      <td style="padding:10px 10px;text-align:right;font-weight:800;color:${rateColor};">${r.rate}%</td>
      <td style="padding:10px 10px;text-align:right;color:#8892A4;">${r.comp}</td>
      <td style="padding:10px 10px;text-align:right;color:#8892A4;">${r.lock}</td>
      <td style="padding:10px 10px;color:#22D3A6;font-size:12px;">${r.tax}</td>
    </tr>`;
  }).join('');
}

// Boot: render portfolio tab on load
document.addEventListener('DOMContentLoaded', () => setTimeout(() => _fdInitTab('portfolio'), 200));
</script>

<button id="themeToggle" class="theme-btn theme-btn--floating" aria-label="Toggle dark/light theme">🌙</button>
<script>
(function(){
  var btn=document.getElementById('themeToggle');
  if(!btn) return;
  var t=document.documentElement.getAttribute('data-theme')||'dark';
  btn.textContent=t==='dark'?'🌙':'☀️';
  btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var nxt=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',nxt);
    localStorage.setItem('finos-theme',nxt);
    btn.textContent=nxt==='dark'?'🌙':'☀️';
  });
})();
</script>
