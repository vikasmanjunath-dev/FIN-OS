<style>
.nw-tab-btn {
  padding:8px 16px;border-radius:20px;border:1px solid var(--border-soft);
  background:var(--bg-surface);color:rgba(255,255,255,.65);font-size:12px;
  font-weight:700;cursor:pointer;transition:all .2s;
}
.nw-tab-btn.active,.nw-tab-btn:hover {
  background:rgba(0,212,255,.15);border-color:rgba(0,212,255,.4);color:#00d4ff;
}
</style>

<script>
const NW_PANELS = { overview:'nw-panel-overview', breakdown:'nw-panel-breakdown', fire:'nw-panel-fire', timeline:'nw-panel-timeline' };
const _nwInited = {};

function nwSwitchTab(tab) {
  document.querySelectorAll('.nw-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  Object.entries(NW_PANELS).forEach(([k, id]) => {
    const el = document.getElementById(id);
    if (el) el.style.display = k === tab ? '' : 'none';
  });
  _nwInitTab(tab);
}

function _nwInitTab(tab) {
  if (_nwInited[tab]) return;
  _nwInited[tab] = true;

  const waitFor = (check, fn) => {
    if (check()) { fn(); return; }
    const t = setInterval(() => { if (check()) { clearInterval(t); fn(); } }, 150);
  };

  waitFor(() => window.FinosNetWorth, () => {
    if (tab === 'overview')   FinosNetWorth.renderOverview(document.getElementById('nw-overview'));
    if (tab === 'breakdown')  FinosNetWorth.renderBreakdown(document.getElementById('nw-breakdown'));
    if (tab === 'fire')       FinosNetWorth.renderFireProgress(document.getElementById('nw-fire'));
    if (tab === 'timeline')   FinosNetWorth.renderTimeline(document.getElementById('nw-timeline'));
  });
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => _nwInitTab('overview'), 200);
});

// Refresh overview if trackers push updated values
document.addEventListener('finos-networth-updated', () => {
  if (_nwInited['overview']) {
    window.FinosNetWorth?.renderOverview(document.getElementById('nw-overview'));
  }
});
</script>
