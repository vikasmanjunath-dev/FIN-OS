  <style>
    /* GEN Z / CYBERPUNK THEME */
    :root {
      --bg: #050505; --panel: #0E0E10; --border: rgba(255, 255, 255, 0.1);
      --neon-lime: #CCFF00; --neon-blue: #00F0FF; --neon-red: #FF2A6D;
    }

    body { background: var(--bg); color: var(--text-primary);  margin: 0; height: 100vh; overflow: hidden; }
    
    /* SIDEBAR */
    .sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); padding: 30px; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; }
    .logo { font-family: 'JetBrains Mono'; font-weight: 800; font-size: 24px; margin-bottom: 40px; }
    .nav-item { display: block; padding: 12px 0; color: #666; text-decoration: none; font-weight: 600; }
    .nav-item.active { color: var(--neon-lime); }

    /* MAIN */
    .main { margin-left: 232px; width: calc(100% - 232px); min-height: 100vh; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; }
    
    /* HEADER */
    .header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; }
    h1 { font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 800; text-transform: uppercase; margin: 0; }
    .sub { color: #666; font-size: 14px; margin-top: 5px; }

    /* SEARCH & CONTROLS */
    .control-panel { background: #0A0A0A; border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-bottom: 30px; }
    
    .input-group { display: flex; gap: 15px; margin-bottom: 25px; }
    input { flex: 1; background: var(--bg-surface); border: 1px solid var(--border); padding: 15px; color: var(--text-primary); font-family: 'JetBrains Mono'; border-radius: 8px; outline: none; }
    input:focus { border-color: var(--neon-blue); }
    
    /* SELECTION TOGGLES */
    .toggle-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .toggle-btn { 
        flex: 1; padding: 12px; border: 1px solid var(--border); background: transparent; 
        color: #666; font-family: 'JetBrains Mono'; font-weight: 700; cursor: pointer; 
        border-radius: 6px; transition: 0.2s;
    }
    .toggle-btn.active { background: rgba(204, 255, 0, 0.1); border-color: var(--neon-lime); color: var(--neon-lime); }
    
    .sub-options { display: none; gap: 10px; animation: fadeIn 0.3s ease; }
    .sub-options.visible { display: flex; }
    
    .sub-btn { 
        flex: 1; padding: 10px; border: 1px solid var(--border); background: transparent; 
        color: #666; font-family: 'JetBrains Mono'; font-size: 12px; cursor: pointer; 
        border-radius: 6px; 
    }
    .sub-btn.active { background: rgba(0, 240, 255, 0.1); border-color: var(--neon-blue); color: var(--neon-blue); }

    .scan-btn { 
        width: 100%; padding: 15px; background: var(--neon-lime); color: #000; font-weight: 800; 
        border: none; border-radius: 8px; font-family: 'JetBrains Mono'; cursor: pointer; margin-top: 15px;
    }
    .scan-btn:hover { transform: scale(1.02); }

    /* TERMINAL OUTPUT */
    .terminal-window { 
        flex: 1; background: #000; border: 1px solid #333; border-radius: 12px; padding: 20px; 
        font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #ccc; overflow-y: auto; 
        line-height: 1.5; white-space: pre-wrap; /* Keeps formatting */
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    
    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #12161d; }
    ::-webkit-scrollbar-thumb { background: #545b66; border-radius: 999px; border: 2px solid #12161d; }
    ::-webkit-scrollbar-thumb:hover { background: #6a7380; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  

/* ── Light mode text overrides (auto-generated) ── */
[data-theme="light"] input {
  color: var(--text-primary) !important;
    background: var(--bg-surface) !important;
}</style>

  <script>
    let currentCategory = 'technical';
    let currentMode = 'intraday';
    let _lastSymbol = '';
    let _lastMode   = '';

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      const sub = document.getElementById('techOptions');
      if (cat === 'technical') {
        sub.classList.add('visible');
        setMode('intraday');
      } else {
        sub.classList.remove('visible');
        currentMode = 'fundamental';
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
      else document.querySelector(`.sub-btn[onclick="setMode('${mode}')"]`)?.classList.add('active');
    }

    async function runAnalysis() {
      const symbol = document.getElementById('ticker').value.trim().toUpperCase();
      if (!symbol) return alert("ENTER SYMBOL");
      _lastSymbol = symbol;
      _lastMode   = currentMode;

      const consoleDiv = document.getElementById('outputConsole');
      consoleDiv.innerHTML = `<span style="color:var(--neon-blue)">// ESTABLISHING LINK TO CORE...<br>// EXECUTING PROTOCOL: ${currentMode.toUpperCase()}<br>...</span>`;

      // Hide previous AI explain
      document.getElementById('mi-ai-explain-panel').style.display = 'none';
      document.getElementById('mi-explain-output').style.display = 'none';
      document.getElementById('mi-explain-output').innerHTML = '';

      try {
        const res  = await fetch(`http://127.0.0.1:5000/analyze?symbol=${symbol}&mode=${currentMode}`);
        const data = await res.json();

        if (data.status === 'success') {
          consoleDiv.innerHTML = data.html;
          // Store parsed metrics for /explain POST
          window._lastScanMetrics = data.viz || {};
          // Show AI Explain button after successful analysis
          document.getElementById('mi-ai-explain-panel').style.display = 'block';
        } else {
          consoleDiv.innerHTML = `<span style="color:var(--neon-red)">ERROR: ${data.message}</span>`;
        }
      } catch(e) {
        consoleDiv.innerHTML = `<span style="color:var(--neon-red)">CONNECTION FAILED: Ensure app.py is running on port 5000.</span>`;
      }
    }

    function openVisualizer() {
      const symbol = document.getElementById('ticker').value;
      if (!symbol) return alert("ENTER SYMBOL FIRST");
      window.location.href = `market-visualizer.html?symbol=${symbol}&mode=${currentMode}`;
    }

    // ── Q2: AI Explain (uses new /explain POST for structured signals) ──────────
    async function miAIExplain() {
      if (!_lastSymbol) return alert("Run a scan first!");

      const btn    = document.getElementById('mi-explain-btn');
      const output = document.getElementById('mi-explain-output');
      btn.textContent  = '⏳ Arya thinking…';
      btn.disabled     = true;
      output.style.display = 'block';
      output.innerHTML = '<span style="color:#7d80bd;">🧠 Arya is reading the signals…</span>';

      try {
        // Try structured /explain POST first (uses parsed metrics from last scan)
        let data;
        const structuredPayload = {
          symbol: _lastSymbol,
          mode:   _lastMode,
          signal: _lastMode === 'fundamental' ? 'HOLD' : 'BUY',  // overridden by LLM analysis
        };

        // Merge any last-scanned metrics (RSI, trend, alignment etc.)
        if (window._lastScanMetrics) {
          structuredPayload.rsi    = window._lastScanMetrics.rsi;
          structuredPayload.trend  = window._lastScanMetrics.trend;
        }

        const explainResp = await fetch('http://127.0.0.1:5000/explain', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(structuredPayload),
        });

        if (explainResp.ok) {
          data = await explainResp.json();
        } else {
          // Fallback to legacy /ai-explain GET
          const res = await fetch(`http://127.0.0.1:5000/ai-explain?symbol=${_lastSymbol}&mode=${_lastMode}`);
          data = await res.json();
        }

        if (data.status === 'success') {
          const recClass = {
            BUY:  'mi-rec-buy',
            SELL: 'mi-rec-sell',
            HOLD: 'mi-rec-hold',
          }[data.recommendation] || 'mi-rec-hold';

          output.innerHTML = `
            <span class="mi-rec-badge ${recClass}">${data.recommendation}</span>
            <div style="color:#e0e2ff;line-height:1.7;">${
              data.explanation.replace(/\n/g, '<br>')
            }</div>
            <div style="margin-top:10px;font-size:11px;color:#555;font-family:'JetBrains Mono';">
              Arya AI · ${_lastSymbol} · ${_lastMode}
            </div>`;
        } else {
          output.innerHTML = `<span style="color:var(--neon-red)">AI unavailable — start app.py on port 5000.</span>`;
        }
      } catch(e) {
        output.innerHTML = `<span style="color:var(--neon-red)">⚠️ app.py not running on localhost:5000.</span>`;
      }

      btn.textContent = '🧠 EXPLAIN THIS ANALYSIS (AI)';
      btn.disabled    = false;
    }

    // ── Q4: Arya Sentiment ───────────────────────────────────────────────────
    async function miLoadSentiment() {
      const symbol = document.getElementById('ticker').value.trim().toUpperCase();
      if (!symbol) { alert("Enter a symbol first!"); return; }

      const bar = document.getElementById('mi-sentiment-bar');
      bar.style.display = 'flex';
      bar.style.background = 'rgba(0,212,255,.06)';
      bar.style.border     = '1px solid rgba(0,212,255,.15)';
      bar.style.color      = '#7d80bd';
      bar.innerHTML        = `<span>🧠</span><span>Arya loading sentiment for ${symbol}…</span>`;

      // Try Ollama via arya-ai.js first, fallback to flask /sentiment
      if (typeof AryaAI !== 'undefined' && AryaAI.newsSentiment) {
        // newsSentiment renders its own panel; we put it in the bar div
        bar.innerHTML = '';
        AryaAI.newsSentiment(symbol, bar);
        return;
      }

      // Direct flask fallback
      try {
        const res  = await fetch(`http://127.0.0.1:5000/sentiment?symbol=${symbol}`);
        const data = await res.json();

        const colors = {
          bullish: { bg:'rgba(0,255,136,.08)', border:'rgba(0,255,136,.2)', dot:'#00ff88', label:'BULLISH ▲' },
          bearish: { bg:'rgba(255,42,109,.08)', border:'rgba(255,42,109,.2)', dot:'#ff2a6d', label:'BEARISH ▼' },
          neutral: { bg:'rgba(255,204,0,.08)',  border:'rgba(255,204,0,.2)',  dot:'#ffcc00', label:'NEUTRAL →' },
        };
        const c = colors[data.sentiment] || colors.neutral;

        bar.style.background = c.bg;
        bar.style.border     = `1px solid ${c.border}`;
        bar.innerHTML = `
          <div style="width:10px;height:10px;border-radius:50%;background:${c.dot};box-shadow:0 0 8px ${c.dot};flex-shrink:0;"></div>
          <strong style="color:${c.dot};">${c.label}</strong>
          <span style="color:rgba(255,255,255,.6);">${data.text}</span>`;
      } catch(e) {
        bar.innerHTML = `<span style="color:#ff2a6d;">⚠️ Sentiment service offline (start app.py)</span>`;
      }
    }

    // Auto-load sentiment when ticker input loses focus
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('ticker').addEventListener('blur', function() {
        if (this.value.trim()) miLoadSentiment();
      });
    });
  </script>
