<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>
  (function(){var t=localStorage.getItem("finos-theme")||localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t);})();
</script>
  <meta charset="UTF-8">
  <meta name="description" content="FIN•OS — Your AI-powered Financial Operating System for Indian investors.">
  <title>FIN-OS | QFT Core Chat</title>
  <style>
    body { background: var(--bg-main); color: var(--text-primary);  margin: 0; display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 15px 20px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; gap: 10px; background: var(--bg-surface); }
    .dot { width: 10px; height: 10px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 10px #4ade80; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; font-family: 'IBM Plex Sans', sans-serif; }
    .msg.user { align-self: flex-end; background: rgba(79, 124, 255, 0.15); border: 1px solid rgba(79, 124, 255, 0.3); color: #fff; }
    .msg.assistant { align-self: flex-start; background: #18181b; border: 1px solid var(--border-soft); }
    
    .input-area { padding: 20px; background: var(--bg-surface); border-top: 1px solid var(--border-soft); display: flex; gap: 10px; }
    input { flex: 1; background: var(--bg-main); border: 1px solid var(--border-soft); color: var(--text-primary); padding: 12px; border-radius: 6px; font-family: 'JetBrains Mono'; }
    button { background: #d4d4d8; color: #000; border: none; padding: 0 25px; font-weight: bold; cursor: pointer; border-radius: 6px; font-family: 'JetBrains Mono'; }
    button:hover { background: #fff; }
  

/* ── Light mode text overrides (auto-generated) ── */
[data-theme="light"] .msg.user {
  color: var(--text-primary) !important;
}
[data-theme="light"] input {
  color: var(--text-primary) !important;
    background: var(--bg-surface) !important;
}</style>
    <link rel="stylesheet" href="../css/design-tokens.css">
  <link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/theme.css">
  <meta property="og:site_name" content="FIN•OS">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/icons/icon-512.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@finos_app">
  <link rel="stylesheet" href="../css/interactions.css">
</head>
<body>
<button id="floatThemeBtn" style="position:fixed;top:16px;right:16px;z-index:200;width:40px;height:40px;border-radius:50%;background:var(--bg-surface);border:1px solid var(--border-soft);color:var(--text-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--card-shadow);transition:transform 160ms,box-shadow 160ms;" aria-label="Toggle theme" onclick="(function(){var t=document.documentElement.getAttribute('data-theme');var n=t==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('finos-theme',n);this.textContent=n==='dark'?'🌙':'☀️';}).call(this)">🌙</button>

  <div class="header">
    <div class="dot"></div>
    <strong>QFT CORE ONLINE</strong>
  </div>

  <div class="chat-container" id="chatBox">
    <div class="msg assistant">SYSTEM INITIALIZED. I am your financial mentor. Feed me your data, and I will give you the brutal mathematical reality.</div>
  </div>

  <div class="input-area">
    <input type="text" id="chatInput" placeholder="Enter your financial query..." autocomplete="off">
    <button id="sendBtn">SEND</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/finos-context.js" defer></script>
  <script>
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    let sessionId = null;

    /** Build a personalised context block from window.FINOS_USER_CONTEXT */
    function buildUserContext() {
      try {
        const ctx = window.FINOS_USER_CONTEXT;
        const id = ctx?.identity || {};
        const INR = n => '₹' + Number(n || 0).toLocaleString('en-IN');
        const name  = id.name  || localStorage.getItem('finos_display_name') || 'Investor';
        const dna   = id.financial_dna || localStorage.getItem('finos_financial_dna') || 'Explorer';
        const lines = [
          `Name: ${name} | DNA: ${dna} | Stage: ${id.life_stage || localStorage.getItem('finos_stage') || 'unknown'}`,
          `Income: ₹${id.income_range || localStorage.getItem('finos_income') || 'unknown'}/month | Mindset: ${id.mindset || localStorage.getItem('finos_mindset') || 'unknown'}`,
        ];
        const prof = ctx?.profile || {};
        lines.push(`Net worth: ${INR(prof.net_worth || localStorage.getItem('finos_net_worth') || 0)} | Savings rate: ${prof.savings_rate || localStorage.getItem('finos_savings_rate') || 0}% | Health: ${prof.health_score || localStorage.getItem('finos_health_score') || 0}/100`);
        const dnaData = ctx?.dna || (() => { try { return JSON.parse(localStorage.getItem('FINOS_CORE_DNA') || 'null'); } catch { return null; } })();
        if (dnaData?.archetype) lines.push(`Archetype: ${dnaData.archetype}`);
        if (dnaData?.scores?.length >= 5) lines.push(`DNA scores → Risk:${dnaData.scores[0]} Discipline:${dnaData.scores[3]} Growth:${dnaData.scores[4]}`);
        const tx = ctx?.financial?.transactions;
        if (tx) lines.push(`Transactions → Income: ${INR(tx.total_income)} | Expenses: ${INR(tx.total_expense)}`);
        const goals = ctx?.financial?.goals;
        if (goals?.length) lines.push(`Goals: ${goals.slice(0,3).map(g => `${g.name} ${g.progress||0}%`).join(' · ')}`);
        const portfolio = ctx?.financial?.portfolio;
        if (portfolio) lines.push(`Portfolio: ${INR(portfolio.total_value)} | P&L: ${portfolio.pnl_pct > 0 ? '+' : ''}${portfolio.pnl_pct}%`);
        const journal = ctx?.trade_journal;
        if (journal?.total_trades) lines.push(`Trade journal: ${journal.total_trades} trades | Win rate: ${journal.win_rate}%`);
        return lines.join('\n');
      } catch { return ''; }
    }

    /** Load psych profile for brain.py */
    function getPsychProfile() {
      try {
        const d = window.FINOS_USER_CONTEXT?.dna || JSON.parse(localStorage.getItem('FINOS_CORE_DNA') || 'null');
        return d?.archetype ? { archetype: d.archetype, bio: d.bio || '', desiContext: d.desiContext || '', chartData: d.scores || [], resilience: d.resilience || 50, leak: d.leak || 'NONE', leakDesc: d.leakDesc || '', strengths: d.strengths || [], weaknesses: d.weaknesses || [], raw: d.raw || {} } : null;
      } catch { return null; }
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      chatInput.value = '';

      const assistantDiv = document.createElement('div');
      assistantDiv.className = 'msg assistant';
      assistantDiv.innerHTML = '<span style="opacity:0.5">Processing...</span>';
      chatBox.appendChild(assistantDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      const userCtx    = buildUserContext();
      const psychProf  = getPsychProfile();

      try {
        const response = await fetch('http://127.0.0.1:8000/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message:       text,
            session_id:    sessionId,
            context:       userCtx || undefined,
            psych_profile: psychProf || undefined,
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        assistantDiv.innerHTML = ''; // clear loading text
        let fullContent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          
          for (let line of lines) {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.replace('data: ', ''));
              if (data.session_id) sessionId = data.session_id; // Save session
              if (data.token) {
                fullContent += data.token;
                assistantDiv.innerHTML = marked.parse(fullContent);
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            }
          }
        }
      } catch (e) {
        assistantDiv.innerHTML = `<span style="color:#FF4F4F">Connection Error: Ensure backend is running.</span>`;
      }
    }

    function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
  </script>
  <script src="../js/finos-widget.js?v=4"></script>
  <script src="../js/finos-search.js?v=2"></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/mobile-nav.js" defer></script>
  <script src="../js/interactions.js" defer></script>
</body>
</html>
