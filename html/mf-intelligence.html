<style>
.mf-tab { padding:8px 16px;border-radius:20px;border:1px solid var(--border-soft);background:var(--bg-surface);color:rgba(255,255,255,.65);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s; }
.mf-tab.active,.mf-tab:hover { background:rgba(0,212,255,.15);border-color:rgba(0,212,255,.4);color:#00d4ff; }
</style>

<script src="../js/finos-widget.js?v=6"></script>
<script src="../js/finos-mobile.js" defer></script>
<script>
function switchTab(tab) {
  document.querySelectorAll('.mf-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['overlap','expense','sip','category'].forEach(t => {
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).style.display = t === tab ? 'block' : 'none';
  });
}

function init() {
  if (!window.MFIntelligence) { setTimeout(init, 200); return; }
  MFIntelligence.renderOverlapTool(document.getElementById('tabOverlap'));
  MFIntelligence.renderExpenseCalculator(document.getElementById('tabExpense'));
  MFIntelligence.renderSIPCalendar(document.getElementById('tabSip'), null);
  MFIntelligence.renderCategoryPerformance(document.getElementById('tabCategory'));
}
document.addEventListener('DOMContentLoaded', () => setTimeout(init, 300));
</script>

<script src="../js/sidebar.js"></script>
<script src="../js/mobile-nav.js" defer></script>
  <script src="../js/interactions.js" defer></script>
<button id="themeToggle" class="theme-btn theme-btn--floating" aria-label="Toggle dark/light theme">🌙</button>
<script>
(function(){
  var btn=document.getElementById('themeToggle');
  if(!btn) return;
  var t=document.documentElement.getAttribute('data-theme')||'dark';
  btn.textContent=t==='dark'?'🌙':'☀️';
  btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var nxt=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',nxt);
    localStorage.setItem('finos-theme',nxt);
    localStorage.setItem('theme',nxt);
    btn.textContent=nxt==='dark'?'🌙':'☀️';
    btn.setAttribute('aria-label',nxt==='dark'?'Switch to light mode':'Switch to dark mode');
  });
})();
</script>
