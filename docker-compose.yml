version: "3.9"

# ════════════════════════════════════════════════════════════════════
# FIN•OS — Docker Compose v2
# All backend services + Nginx API Gateway on single port 8000
#
# Port map (internal):
#   8001 = alert-engine   → /api/alerts/*
#   8003 = stock-engine   → /api/stocks/*
#   8004 = document-ai    → /api/docs/*
#   5000 = market-intel   → /api/market/*
#   7475 = arya-ai       → /api/arya/*
#   7476 = rag-engine    → /api/rag/*
#   8010 = gateway-health → /health (aggregated status of all services)
#   8765 = voice-agent-ws → proxied as /ws/voice
#   3000 = frontend (static)
#   8000 = API GATEWAY (single entry point for all above)
#
# Budget tracking is NOT here — the Django budget-backend (ExpenseTracker/)
# was retired in favour of the Supabase-backed Command Hub trackers
# (html/track-finances.html + 23 tracker pages), which is the canonical
# implementation. See ../_archive/ExpenseTracker if that code is ever needed.
# ════════════════════════════════════════════════════════════════════

services:

  # ── Core AI ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama
    ports:
      # loopback only: Ollama has no authentication, and on a published port anyone on the network can run, pull or DELETE models.
      # The other containers reach it as http://ollama:11434 on the compose network and need no published port.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Alert Engine + Health Score ──────────────────────────────────
  alert-engine:
    build: ./alerts
    expose:
      - "8001"
    env_file: ./alerts/.env
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Voice Agent ──────────────────────────────────────────────────
  voice-agent:
    build: ./voiceagent
    ports:
      # The voice agent has no login and speaks for whichever user id a client claims: loopback by default.
      # To use it from another device set VOICE_BIND=0.0.0.0 AND put TLS + authentication in front of it first.
      - "${VOICE_BIND:-127.0.0.1}:8765:8765"   # WebSocket — kept direct for low-latency
      - "${VOICE_BIND:-127.0.0.1}:8080:8080"   # Voice UI
    environment:
      - VOICE_WS_HOST=0.0.0.0     # inside the container; the published port above decides who can reach it
    env_file: ./voiceagent/.env
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Stock Engine (FastAPI) ───────────────────────────────────────
  stock-engine:
    build: ./stock-engine/backend
    expose:
      - "8003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Document AI (FastAPI) ────────────────────────────────────────
  document-ai:
    build: ./document-ai
    expose:
      - "8004"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port 8004

  # ── Market Intelligence (Flask) ──────────────────────────────────
  market-intel:
    build: ./market\ intelligence
    expose:
      - "5000"
    restart: unless-stopped

  # ── Arya AI (FastAPI) ────────────────────────────────────────────
  arya-ai:
    build: ./arya-ai
    expose:
      - "7475"
    env_file:
      - path: ./arya-ai/.env
        required: false
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ARYA_TRUST_PROXY=1        # safe only because this service is not published: nginx (api-gateway) is the sole client
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── RAG engine (FastAPI + Qdrant/SQLite FTS5) ────────────────────
  rag-engine:
    build: ./rag-engine
    expose:
      - "7476"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Gateway health aggregator ────────────────────────────────────
  gateway-health:
    build: ./gateway
    expose:
      - "8010"
    restart: unless-stopped

  # ── API GATEWAY (Nginx) — single entry point port 8000 ──────────
  api-gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - alert-engine
      - stock-engine
      - document-ai
      - market-intel
      - arya-ai
      - rag-engine
      - gateway-health
    restart: unless-stopped

  # ── Frontend (Static) ────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    # Only the static site is mounted. The repo root used to be mounted whole, which served arya-ai/.env, alerts/.env, voiceagent/.env,
    # voiceagent/.finos_key.pem, supabase/*.sql and every backend's source at http://host:3000/<path>.
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./login.html:/usr/share/nginx/html/login.html:ro
      - ./manifest.json:/usr/share/nginx/html/manifest.json:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
      - ./html:/usr/share/nginx/html/html:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./calculators:/usr/share/nginx/html/calculators:ro
      - ./TradeJournal:/usr/share/nginx/html/TradeJournal:ro
      - "./Porfolio Analyser:/usr/share/nginx/html/Porfolio Analyser:ro"
      - ./News1/index.html:/usr/share/nginx/html/News1/index.html:ro
      - ./voiceagent/index.html:/usr/share/nginx/html/voiceagent/index.html:ro
    restart: unless-stopped

volumes:
  ollama_data:
