version: "3.9"

# ════════════════════════════════════════════════════════════════════
# FIN•OS — Docker Compose v2
# All backend services + Nginx API Gateway on single port 8000
#
# Port map (internal):
#   8001 = alert-engine   → /api/alerts/*
#   8002 = budget-backend → /api/budget/*
#   8003 = stock-engine   → /api/stocks/*
#   8004 = document-ai    → /api/docs/*
#   8005 = market-intel   → /api/market/*
#   8765 = voice-agent-ws → proxied as /ws/voice
#   3000 = frontend (static)
#   8000 = API GATEWAY (single entry point for all above)
# ════════════════════════════════════════════════════════════════════

services:

  # ── Core AI ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Alert Engine + Health Score ──────────────────────────────────
  alert-engine:
    build: ./alerts
    expose:
      - "8001"
    env_file: ./alerts/.env
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Voice Agent ──────────────────────────────────────────────────
  voice-agent:
    build: ./voiceagent
    ports:
      - "8765:8765"   # WebSocket — kept direct for low-latency
      - "8080:8080"   # Voice UI
    env_file: ./voiceagent/.env
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Budget Backend (Django) ──────────────────────────────────────
  budget-backend:
    build: ./ExpenseTracker/finos_backend
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=finos_backend.settings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/overview/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Stock Engine (FastAPI) ───────────────────────────────────────
  stock-engine:
    build: ./stock-engine/backend
    expose:
      - "8003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Document AI (FastAPI) ────────────────────────────────────────
  document-ai:
    build: ./document-ai
    expose:
      - "8004"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port 8004

  # ── Market Intelligence (Flask) ──────────────────────────────────
  market-intel:
    build: ./market\ intelligence
    expose:
      - "5000"
    restart: unless-stopped

  # ── API GATEWAY (Nginx) — single entry point port 8000 ──────────
  api-gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - alert-engine
      - budget-backend
      - stock-engine
      - document-ai
      - market-intel
    restart: unless-stopped

  # ── Frontend (Static) ────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  ollama_data:
