version: "3.9"

services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  alert-engine:
    build: ./alerts
    ports:
      - "8001:8001"
    env_file: ./alerts/.env
    depends_on:
      - ollama
    restart: unless-stopped

  voice-agent:
    build: ./voiceagent
    ports:
      - "8765:8765"
      - "8080:8080"
    env_file: ./voiceagent/.env
    depends_on:
      - ollama
    restart: unless-stopped

  budget-backend:
    build: ./ExpenseTracker/finos_backend
    ports:
      - "8002:8000"
    restart: unless-stopped

  stock-engine:
    build: ./stock-engine/backend
    ports:
      - "8003:8003"
    restart: unless-stopped

  document-ai:
    build: ./document-ai
    ports:
      - "8004:8004"
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port 8004

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  ollama_data:
